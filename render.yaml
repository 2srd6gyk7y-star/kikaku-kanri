services:
  - type: web
    name: kikaku-kanri
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 60
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
# APP_BASE_URL / LINE_CHANNEL_ACCESS_TOKEN / LINE_TO は、
# 必要になったときに Render のダッシュボードから直接足せばOK（起動には不要）。
